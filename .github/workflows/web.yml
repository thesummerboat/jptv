name: Bygg webbappen

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Bygg
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: jptv-web:test
          build-args: VERSION=1.${{ github.run_number }}

      - name: Testa (i containern, med dess ffmpeg)
        run: docker run --rm jptv-web:test python -m unittest discover -s tests -t . -v

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicera på ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64
          build-args: VERSION=1.${{ github.run_number }}
          tags: |
            ghcr.io/thesummerboat/jptv-web:latest
            ghcr.io/thesummerboat/jptv-web:1.${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/thesummerboat/jptv
            org.opencontainers.image.title=JPTV Web
            org.opencontainers.image.description=Plex och live-TV i webbläsaren på hemmanätet
