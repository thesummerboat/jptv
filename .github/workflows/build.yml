name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Packa upp signeringsnyckeln
        env:
          JPTV_SIGNING_PASSWORD: ${{ secrets.JPTV_SIGNING_PASSWORD }}
        run: |
          if [ -z "$JPTV_SIGNING_PASSWORD" ]; then
            echo "::error::Hemligheten JPTV_SIGNING_PASSWORD saknas. Lägg till den under Settings → Secrets and variables → Actions."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in app/jptv.keystore.enc -out "$RUNNER_TEMP/jptv.keystore" \
            -pass env:JPTV_SIGNING_PASSWORD
          echo "JPTV_KEYSTORE=$RUNNER_TEMP/jptv.keystore" >> "$GITHUB_ENV"

      - name: Testa och bygg
        env:
          JPTV_SIGNING_PASSWORD: ${{ secrets.JPTV_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Kompilerings- och testfel som anteckningar, så att de syns direkt på bygget (och kan läsas via API:t).
      - name: Visa fel
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          grep -E "^e: |FAILED|What went wrong|> .*(Exception|Error|expected)|^\s+(org\.junit|java\.lang|kotlin\.)|^\s+at se\.jptv" "$log" \
            | head -80 > "$RUNNER_TEMP/errors.txt" || true
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            [ $i -le 45 ] && echo "::error::${line//%/%25}"
          done < "$RUNNER_TEMP/errors.txt"
          exit 0

      - name: Döp om APK
        run: cp app/build/outputs/apk/release/app-release.apk jptv.apk

      - name: Ta bort nyckeln från maskinen
        if: always()
        run: rm -f "$RUNNER_TEMP/jptv.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: jptv-apk
          path: jptv.apk

      # Samma filnamn i varje release, så att länken .../releases/latest/download/jptv.apk alltid
      # pekar på senaste versionen. Appens uppdaterare letar efter just det namnet.
      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: JPTV 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: jptv.apk
          body: |
            Bygge ${{ github.run_number }} från ${{ github.sha }}.
            Har du JPTV installerad uppdaterar den sig själv. Annars: se README.
